{% extends "layout.html" %}

{% block content %}

<h2>Edit Password</h2>

<form method="POST">

    <p>
        <label for="website">Website</label><br>
        <input
            type="text"
            id="website"
            name="website"
            value="{{ password.website }}"
            required
        >
    </p>

    <p>
        <label for="username">Username</label><br>
        <input
            type="text"
            id="username"
            name="username"
            value="{{ password.username }}"
            required
        >
    </p>

    <p>
        <label for="password">Password</label><br>
        <input
            type="text"
            id="password"
            name="password"
            value="{{ decrypt_password(password.encrypted_password) }}"
            required
        >
    </p>

    <p>
        <label for="notes">Notes</label><br>
        <textarea
            id="notes"
            name="notes"
            rows="4"
            cols="50"
        >{{ password.notes }}</textarea>
    </p>

    <p>
        <button type="submit">Update Password</button>
        <a href="{{ url_for('dashboard') }}">Cancel</a>
    </p>

</form>

{% endblock %}
