{% extends "layout.html" %}

{% block content %}

<h2>Import Passwords</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">Select CSV File</label>
        <input
            type="file"
            name="csv_file"
            accept=".csv"
            class="form-control"
            required
        >
    </div>

    <button
        type="submit"
        class="btn btn-primary"
    >
        Import
    </button>

    <a
        href="{{ url_for('dashboard') }}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>

{% endblock %}
